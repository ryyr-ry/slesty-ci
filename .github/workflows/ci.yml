# Public CI for the PRIVATE Slesty repository.
#
# SECURITY MODEL (do not change without review):
#
# THE NON-NEGOTIABLE RULE: nothing derived from the private repository is
# EVER stored in this public repository - not as a release, not as an
# artifact, not as a cache, not for a second. GitHub makes public-repo
# artifacts and releases downloadable by ANYONE with the URL, so even a
# "temporary" upload is a leak.
#
# Therefore:
# - Public runners CLONE the private source with a read-only SSH deploy key.
# - They build and test it on SIX targets (3 OS x 2 architectures).
# - Each job pushes its finished binary DIRECTLY into ONE release in the
#   PRIVATE repository via a write-scoped release token. One CI run = one
#   private release with six assets - no release spam per OS.
# - This repository keeps NO artifacts, NO releases, NO caches.
#
# KEYS (both stored as encrypted secrets in THIS repo):
# - SLESTY_DEPLOY_KEY   : read-only SSH deploy key on ryyr-ry/Slesty.
# - SLESTY_RELEASE_TOKEN: fine-grained PAT with contents:read/write on
#   ryyr-ry/Slesty ONLY.
#
# TARGET MATRIX (all official GitHub-hosted runners):
#   linux   x64  : ubuntu-24.04
#   linux   arm64: ubuntu-24.04-arm
#   windows x64  : windows-2022
#   windows arm64: windows-11-arm
#   macos   x64  : macos-15-intel
#   macos   arm64: macos-14
#
# CRLF GUARD: secrets created from Windows can carry \r, which breaks ssh
# key parsing ("error in libcrypto"). The normalize step strips it.

name: Slesty CI (build + test on public runners)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or SHA of ryyr-ry/Slesty to build"
        required: false
        default: "main"
  schedule:
    # Weekly refresh: Monday 03:00 UTC.
    - cron: "0 3 * * 1"

permissions: {} # nothing in this public repo needs any permission

env:
  CARGO_TERM_COLOR: always
  PRIVATE_REPO: ryyr-ry/Slesty
  # One release per CI run: every job appends its asset to this tag.
  RELEASE_TAG: ci-${{ github.run_number }}

jobs:
  build-test:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-24.04
          - target: linux-arm64
            os: ubuntu-24.04-arm
          - target: windows-x64
            os: windows-2022
          - target: windows-arm64
            os: windows-11-arm
          - target: macos-x64
            os: macos-15-intel
          - target: macos-arm64
            os: macos-14
    steps:
      - name: Normalize the deploy key (strip any CRLF from the secret)
        shell: bash
        run: |
          mkdir -p "$HOME/.ssh"
          printf '%s' "$SLESTY_DEPLOY_KEY" | tr -d '\r' > "$HOME/.ssh/id_ed25519"
          printf '\n' >> "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keygen -y -f "$HOME/.ssh/id_ed25519" > /dev/null || { echo "read key parse failed"; exit 1; }
          ssh-keyscan -t ed25519 github.com >> "$HOME/.ssh/known_hosts" 2>/dev/null
        env:
          SLESTY_DEPLOY_KEY: ${{ secrets.SLESTY_DEPLOY_KEY }}

      - name: Checkout the private source (runtime, read-only deploy key)
        shell: bash
        run: |
          GIT_SSH_COMMAND="ssh -i $HOME/.ssh/id_ed25519 -o IdentitiesOnly=yes" \
            git clone --depth 1 "git@github.com:${PRIVATE_REPO}.git" slesty
          cd slesty
          git checkout "${{ github.event.inputs.ref || 'main' }}"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install protoc (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          echo "PROTOC=$(command -v protoc)" >> "$GITHUB_ENV"

      - name: Install protoc (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install protobuf
          echo "PROTOC=$(command -v protoc)" >> "$GITHUB_ENV"

      - name: Install protoc (Windows x64)
        if: runner.os == 'Windows' && runner.arch == 'X64'
        run: |
          choco install protoc -y
          $protoc = Get-Command protoc -ErrorAction SilentlyContinue
          if (-not $protoc) { $protoc = Get-Command "C:\ProgramData\chocolatey\bin\protoc.exe" -ErrorAction SilentlyContinue }
          if (-not $protoc) { throw "protoc not found after choco install" }
          "PROTOC=$($protoc.Source)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install protoc (Windows arm64)
        if: runner.os == 'Windows' && runner.arch == 'ARM64'
        shell: bash
        run: |
          # Chocolatey is unavailable on windows-11-arm; download the
          # official protoc release zip instead. The win64 binary runs on
          # ARM64 via x64 emulation.
          # NOTE: $GITHUB_ENV does NOT expand bash variables - the path
          # must be fully resolved here or prost sees a literal "$HOME".
          set -euo pipefail
          PB_REL="https://github.com/protocolbuffers/protobuf/releases"
          VERSION="29.3"
          curl -sSL -o protoc.zip "${PB_REL}/download/v${VERSION}/protoc-${VERSION}-win64.zip"
          mkdir -p "$RUNNER_TEMP/protoc"
          unzip -o protoc.zip -d "$RUNNER_TEMP/protoc" > /dev/null
          PROTOC_PATH="$(cygpath -w "$RUNNER_TEMP/protoc/bin/protoc.exe")"
          "$RUNNER_TEMP/protoc/bin/protoc.exe" --version
          echo "PROTOC=${PROTOC_PATH}" >> "$GITHUB_ENV"

      - name: Capture the tested commit (for release asset naming)
        shell: bash
        run: |
          cd slesty
          echo "SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: rustfmt
        run: cargo fmt --all -- --check
        working-directory: slesty

      - name: clippy (-D warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
        working-directory: slesty

      - name: tests (offline; real-fixture tests skip without SLESTY_FIXTURES)
        run: cargo test --workspace
        working-directory: slesty

      - name: release build
        run: cargo build --release
        working-directory: slesty

      # ------------------------------------------------------------------
      # Publish: append this target's binary to the ONE private release.
      # `gh release create` on a tag that exists becomes idempotent: it
      # just adds the new assets, so parallel jobs converge on one
      # release with six assets. (gh errors on existing tag with
      # --clobber behaviour we avoid by trying upload-asset first.)
      # ------------------------------------------------------------------
      - name: Publish the binary to the PRIVATE repository's release
        shell: bash
        env:
          SHA: ${{ env.SHA }}
          GH_TOKEN: ${{ secrets.SLESTY_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          REF="${{ github.event.inputs.ref || 'main' }}"
          BIN="slesty/target/release/slesty"
          if [ -f "${BIN}.exe" ]; then
            cp "${BIN}.exe" "slesty-${{ matrix.target }}-${SHA}.exe"
            ASSET="slesty-${{ matrix.target }}-${SHA}.exe"
          else
            cp "$BIN" "slesty-${{ matrix.target }}-${SHA}"
            ASSET="slesty-${{ matrix.target }}-${SHA}"
          fi
          NOTES="Automated build from the public CI harness.
          Commit ${SHA} of ${PRIVATE_REPO}: rustfmt clean, clippy -D warnings clean, cargo test green.
          Assets: linux-x64, linux-arm64, windows-x64, windows-arm64, macos-x64, macos-arm64.
          PRIVATE release (in the source repository); the public CI repo keeps no binaries."
          # Create the release if this job is first (ignore "already_exists")
          # so all six jobs converge on the SAME release.
          if ! gh release view "${RELEASE_TAG}" --repo "${PRIVATE_REPO}" > /dev/null 2>&1; then
            gh release create "${RELEASE_TAG}" \
              --repo "${PRIVATE_REPO}" \
              --target "${REF}" \
              --title "Slesty CI run ${GITHUB_RUN_NUMBER}" \
              --notes "${NOTES}" || true
          fi
          gh release upload "${RELEASE_TAG}" "$ASSET" \
            --repo "${PRIVATE_REPO}" --clobber
          echo "Uploaded ${ASSET} to ${PRIVATE_REPO}@${RELEASE_TAG}"
