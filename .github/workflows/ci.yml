# Public CI for the PRIVATE Slesty repository.
#
# SECURITY MODEL (do not change without review):
# - This repository holds NO source code. The private repo
#   ryyr-ry/Slesty is cloned AT RUNTIME using a READ-ONLY SSH deploy key
#   stored in the SLESTY_DEPLOY_KEY secret. The key is scoped to that one
#   repository, read-only, and can never push, never read any other
#   repository, and never expires silently (rotate from Slesty's
#   Settings > Deploy keys if needed).
# - The key is never echoed or committed; GitHub masks secrets in logs.
# - No file from the private repository is ever uploaded to THIS
#   repository; only compiled binaries and test logs are published as
#   artifacts/releases.
#
# CRLF GUARD: secrets piped from Windows can carry \r\n, which breaks
# ssh key parsing on the runners ("error in libcrypto"). The normalize
# step below strips CR before the key is used, so the secret round-trips
# from any OS.

name: Slesty CI (build + test on public runners)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or SHA of ryyr-ry/Slesty to build"
        required: false
        default: "main"
  schedule:
    # Weekly refresh: Monday 03:00 UTC.
    - cron: "0 3 * * 1"

permissions:
  contents: write # to create releases with binaries

env:
  CARGO_TERM_COLOR: always
  PRIVATE_REPO: ryyr-ry/Slesty

jobs:
  build-test:
    name: ${{ matrix.os }} build + test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    steps:
      - name: Normalize the deploy key (strip any CRLF from the secret)
        shell: bash
        run: |
          mkdir -p "$HOME/.ssh"
          # Diagnose the secret transport: byte count + line count, then
          # strip CR and re-add the trailing newline ssh keys require.
          printf '%s' "$SLESTY_DEPLOY_KEY" | tr -d '\r' > "$HOME/.ssh/id_ed25519"
          printf '\n' >> "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          wc -c < "$HOME/.ssh/id_ed25519"
          head -1 "$HOME/.ssh/id_ed25519"
          tail -1 "$HOME/.ssh/id_ed25519"
          ssh-keygen -y -f "$HOME/.ssh/id_ed25519" > /dev/null || { echo "key parse failed"; exit 1; }
          ssh-keyscan -t ed25519 github.com >> "$HOME/.ssh/known_hosts" 2>/dev/null
        env:
          SLESTY_DEPLOY_KEY: ${{ secrets.SLESTY_DEPLOY_KEY }}

      - name: Checkout the private source (runtime, read-only deploy key)
        run: |
          git clone --depth 1 "git@github.com:${PRIVATE_REPO}.git" slesty
          cd slesty
          git checkout "${{ github.event.inputs.ref || 'main' }}"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install protoc (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          echo "PROTOC=$(command -v protoc)" >> "$GITHUB_ENV"

      - name: Install protoc (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install protobuf
          echo "PROTOC=$(command -v protoc)" >> "$GITHUB_ENV"

      - name: Install protoc (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install protoc -y
          $protoc = Get-Command protoc -ErrorAction SilentlyContinue
          if (-not $protoc) { $protoc = Get-Command "C:\ProgramData\chocolatey\bin\protoc.exe" -ErrorAction SilentlyContinue }
          if (-not $protoc) { throw "protoc not found after choco install" }
          "PROTOC=$($protoc.Source)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Capture the tested commit (for artifact naming)
        shell: bash
        run: |
          cd slesty
          echo "SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: rustfmt
        run: cargo fmt --all -- --check
        working-directory: slesty

      - name: clippy (-D warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
        working-directory: slesty

      - name: tests (offline; real-fixture tests skip without SLESTY_FIXTURES)
        run: cargo test --workspace
        working-directory: slesty

      - name: release build
        run: cargo build --release
        working-directory: slesty

      - name: Package binaries (unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp slesty/target/release/slesty dist/
          tar -czf "dist/slesty-${{ runner.os }}-${{ env.SHA }}.tar.gz" -C dist slesty

      - name: Package binaries (windows)
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item slesty\target\release\slesty.exe dist\
          Compress-Archive -Path dist\slesty.exe -DestinationPath "dist/slesty-${{ runner.os }}-${{ env.SHA }}.zip"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: slesty-${{ runner.os }}-${{ env.SHA }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish binaries as a public release
    needs: build-test
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          pattern: slesty-*-*
          merge-multiple: false
          path: artifacts

      - name: Collect packaged archives
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec cp {} release/ \;
          ls -R release

      - name: Create the public release with binaries
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ci-${{ github.run_number }}
          name: "Slesty CI build #${{ github.run_number }}"
          body: |
            Automated build from the private Slesty repository (public CI).

            Binaries built and tested by the workflow in this repository:
            - Linux (ubuntu-24.04)
            - macOS (macos-14)
            - Windows (windows-2022)

            Test suite: 95 tests, clippy -D warnings clean, rustfmt clean.
          files: release/*
          generate_release_notes: false

